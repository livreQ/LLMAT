!!python/object:argparse.Namespace
# Multi-objective Bayesian Optimization with LapeFT
# finetuning: false (fixed features only for now)
n_init_data: 10
exp_len: 100
acqf: ts # ts (Thompson Sampling) for multi-objective, alternatives: ucb
prompt_type: just-smiles
run_subset_only: false
feature_reduction: average
iupac: false
normalize_y: false
clustering_type: kmeans
n_clusters: 5
laplace_type: all_layer
fix_args:
  method: laplace # gp, laplace, random
  batch_size: 256
finetuning_args:
  batch_size: 16
  lora:
    r: 4
    alpha: 16
    dropout: 0.1
    bias: none
    save: head
    lr: 3e-3
  laplace:
     type: all
     n_epochs: 30
     noise_var: 0.001
     hess_fac: full
